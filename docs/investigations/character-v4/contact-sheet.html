<!doctype html><meta charset="utf-8"><title>Pony.ai · 接入素材核对</title><style>*{box-sizing:border-box}body{font:14px/1.5 system-ui;background:#eff4f5;color:#27414c;margin:0;padding:28px}h1{font-size:26px}h2{font-size:18px;margin-top:32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cell{background:white;border-radius:16px;padding:18px 8px;text-align:center}.figure{width:216px;height:216px;position:relative;margin:auto}.portrait{width:59.26%;height:100%;position:absolute;left:20.37%}.portrait>.body{width:100%;height:100%}.mark{position:absolute;width:15%;height:auto}.label{font-size:12px;margin-top:6px;min-height:40px}.label b{display:block;color:#217181}header p{color:#647f86}.sizes{display:flex;align-items:end;gap:32px}button{font:inherit;padding:8px 14px;border:1px solid #bcced3;background:white;border-radius:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.figure{width:190px;height:190px}body{padding:14px}}</style><header><h1>Pony.ai · 伙伴接入素材</h1><p>原生透明贴图 · 真实等级描述 · 十二种身上标识</p><p>本页是接入素材核对，实际 DSH 运行验证另行进行。</p></header><h2>同一个伙伴，十二个等级</h2><div class="grid" id="levels"></div><h2>十种表情</h2><div class="grid" id="expressions"></div><h2>实际尺寸</h2><div class="sizes" id="sizes"></div><script>
const root='../../../src/dsh/client/';
const anchors=[[77.49999999999999,54,-14],[70.42857142857143,52,12],[77.16071428571428,51,-8],[73.76785714285712,45,-28],[68.55357142857142,51,25],[76.48597194388778,52.07640280561121,10],[74.05228758169936,47.99346405228758,-18],[72.09644288577152,50,8],[31.410445891783557,49.999999999999986,-18],[69.28957915831663,51.038201402805605,-22]];
const names=['日常','等待你','专注工作','开心庆祝','遇到问题','困倦休息','欢迎','好奇惊喜','自信完成','放松暂停'];
function cell(level,pose,size=216){const c=document.createElement('div');c.className='cell';const f=document.createElement('div');f.className='figure';f.style.width=f.style.height=size+'px';const p=document.createElement('div');p.className='portrait';const body=document.createElement('img');body.className='body';body.src=root+'assets/companion/pose-'+pose+'.png';body.alt=names[pose];const mark=document.createElement('img');mark.className='mark';mark.src=root+'assets/insignia/l'+(level+1)+'.svg';const [x,y,a]=anchors[pose];Object.assign(mark.style,{left:x+'%',top:y+'%',transform:'translate(-50%,-50%) rotate('+a+'deg)'});p.append(body,mark);f.append(p);const l=document.createElement('div');l.className='label';const b=document.createElement('b');b.textContent='Pony.ai · L'+(level+1);l.append(b,document.createTextNode(labels[level]['zh-CN']));c.append(f,l);return c}
let labels;fetch(root+'character-levels.json').then(r=>r.json()).then(data=>{labels=data;for(let i=0;i<12;i++)document.getElementById('levels').append(cell(i,0));for(let i=0;i<10;i++){const c=cell(6,i);const n=document.createElement('p');n.textContent=names[i];c.append(n);document.getElementById('expressions').append(c)}for(const size of [112,216])document.getElementById('sizes').append(cell(1,0,size));});
</script>
