<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pony.ai · 原版十二级演进</title>
<style>:root{font-family:system-ui,sans-serif;color:#15354f;background:#f6f9fc}body{margin:0;padding:32px}header,main{max-width:1360px;margin:auto}h1{font-size:28px}p{line-height:1.8}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{padding:10px 16px;font:inherit;color:inherit;background:transparent;border:1px solid #8ba4b8;border-radius:8px;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px}figure{margin:0;background:transparent}img{width:100%;aspect-ratio:1;object-fit:contain;background:transparent;box-shadow:none;filter:none}figcaption{font-weight:600;margin:8px 0 28px}small{display:block;font-weight:400;opacity:.72;margin-top:8px}.dark{background:#142437;color:#eef6fc}.compact img{width:144px;height:144px;display:block;margin:50px auto}</style>
<header><h1>Pony.ai · 原版十二级演进</h1><p>从车内安全员到远程规模监管。蓝白车身、中央雷达、纯文字标识。<br>透明素材预览，尚未替换运行中的插件。高等级的小车和连接线为规模示意，实际监管数量以下方文字为准。</p><nav><button onclick="document.body.classList.remove('dark')">浅色页面</button><button onclick="document.body.classList.add('dark')">深色页面</button><button onclick="document.body.classList.toggle('compact')">切换悬浮尺寸</button></nav></header><main id="grid"></main><script>
const rows=[['主驾有人 · 有保护车','副驾无人'],['主驾有人 · 无保护车','副驾无人'],['副驾安全员 · 有保护车','主驾无人'],['副驾安全员 · 无保护车','主驾无人'],['远程监管 1 辆','车内无人 · 无保护车'],['远程监管 3 辆','一名远程监管人员'],['远程监管 10 辆','一名远程监管人员'],['远程监管 100 辆','一名远程监管人员'],['远程监管 1,000 辆','一名远程监管人员'],['远程监管 10,000 辆','一名远程监管人员'],['远程监管 100,000 辆','一名远程监管人员'],['远程监管 1,000,000 辆','一名远程监管人员']];
grid.innerHTML=rows.map(([a,b],i)=>`<figure><img src="l${i+1}.png" alt="L${i+1} ${a} ${b}"><figcaption>L${i+1} · ${a}<small>${b}</small></figcaption></figure>`).join('');
</script></html>
